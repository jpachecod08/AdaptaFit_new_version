[build]
  base = "frontend"
  publish = "dist"
  command = "npm install && npm run build"

[build.environment]
  VITE_API_URL = "https://adaptafit.onrender.com"

# SPA Fallback: servir index.html para rutas del React Router (deep links)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
